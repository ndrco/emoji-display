[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emoji-display"
version = "0.1.0"
description = "Local HTTP/CLI bridge for an external emoji display device."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "NDRCo" }]
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
dev = ["pytest>=8"]

[project.scripts]
emoji-displayd = "emoji_display.server:main"
displayctl = "emoji_display.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
